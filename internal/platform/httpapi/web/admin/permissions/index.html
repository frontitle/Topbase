<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/admin.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 权限</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/admin/permissions/permissions.css?v=1">
</head>
<body>
  <aside class="sidebar" data-shell="admin" data-active="permissions"></aside>
  <div class="page">
    <main>
      <div class="page-head"><div><h1>权限管理</h1><p>按组设置数据、内容和后台权限。项目角色在“人员与组”中设置。</p></div><button class="primary tb-btn tb-btn-primary" id="save">保存权限</button></div>
      <section class="section-block"><div class="section-row"><h2>用户组权限</h2><span>保存后生效</span></div><div class="table-wrap"><table class="fields-table"><thead><tr><th>用户组</th><th>数据浏览</th><th>SQL 查询</th><th>内容创作</th><th>后台管理</th></tr></thead><tbody id="matrix"></tbody></table></div></section>
      <section class="section-block"><h2>权限说明</h2><p class="panel-help">管理员组拥有完整权限。外部部门可在“人员与组”中映射到权限分组。</p></section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script>
    let groups=[],graph={revision:1,data_graph:{},collection_graph:{}};
    const choices=(value,opts)=>'<span class="permission-select-wrap"><select class="permission-select tb-select">'+opts.map(x=>'<option value="'+x[0]+'" '+(value===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></span>';
    function perm(id){return graph.data_graph[id]||{data:'none',sql:'none',collections:'none',admin:'none'}}
    function draw(){ $('#matrix').innerHTML=groups.map(g=>{const p=perm(g.id);return '<tr data-id="'+esc(g.id)+'"><td><b translate="no">'+esc(g.name)+'</b><br><small>'+esc(g.kind)+'</small></td><td>'+choices(p.data,[['none','无访问'],['view','可浏览'],['curate','可管理']])+'</td><td>'+choices(p.sql,[['none','禁止'],['query','可查询'],['native','原生 SQL']])+'</td><td>'+choices(p.collections,[['none','无访问'],['view','可查看'],['edit','可编辑']])+'</td><td>'+choices(p.admin,[['none','无'],['admin','管理员']])+'</td></tr>'}).join('')||'<tr><td colspan="5">尚无用户组</td></tr>'; $('#matrix').querySelectorAll('tr[data-id]').forEach(row=>row.querySelectorAll('select').forEach(s=>s.disabled=row.dataset.id==='grp_admins')) }
    async function load(){[groups,graph]=await Promise.all([api('/api/groups'),api('/api/permissions/graph')]);graph.data_graph=graph.data_graph||{};draw()}
    $('#save').onclick=async()=>{ $('#matrix').querySelectorAll('tr[data-id]').forEach(row=>{const v=[...row.querySelectorAll('select')].map(x=>x.value);graph.data_graph[row.dataset.id]={data:v[0],sql:v[1],collections:v[2],admin:v[3]}});try{await api('/api/permissions/graph','PUT',graph);toast('权限已保存');load()}catch(e){toast(e.message)}};
    load().catch(e=>toast(e.message));
  </script>
</body>
</html>
