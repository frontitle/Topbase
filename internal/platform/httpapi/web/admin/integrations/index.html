<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topbase · 通知与订阅</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/ui.css?v=sidebar-compact-2"><link rel="stylesheet" href="/admin/integrations/integrations.css?v=1"></head><body><aside class="sidebar" data-shell="admin" data-active="integrations"></aside><div class="page"><header class="topbar"><strong>管理后台</strong><span>/</span><strong>通知与订阅</strong></header><main class="notify-page"><div class="page-head"><div><h1>通知与订阅</h1><p>统一管理群 Webhook、消息样式、仪表盘订阅和发送记录。</p></div><button class="primary" id="add-hook">创建 Webhook</button></div><section class="section-block"><div class="section-row"><div><h2>Webhook 通道</h2><span>飞书、钉钉、企业微信优先适配；每个通道可配置消息模板。</span></div></div><div id="hooks" class="hook-grid"></div></section><section class="section-block"><div class="section-row"><div><h2>订阅管理</h2><span>可验证、暂停或删除；运行状态已迁入此处。</span></div><div class="filters"><select id="sub-filter"><option value="all">全部状态</option><option value="enabled">已启用</option><option value="disabled">已暂停</option></select><input id="sub-search" placeholder="搜索仪表盘或通道"></div></div><div class="table-wrap"><table class="notify-table"><thead><tr><th>仪表盘</th><th>通道</th><th>计划</th><th>最近发送</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody id="subscriptions"></tbody></table></div></section><section class="section-block"><div class="section-row"><div><h2>发送记录</h2><span>保留仪表盘订阅与系统通知的生成时间和内容。</span></div></div><div class="table-wrap"><table class="notify-table"><thead><tr><th>时间</th><th>标题</th><th>内容</th></tr></thead><tbody id="history"></tbody></table></div></section></main></div><div id="toast"></div><script src="/ui.js"></script><script src="/shell.js"></script><script src="/admin/integrations/integrations.js?v=2"></script></body></html>
