<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/admin.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 人员与组</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/admin/people/people.css">
</head>
<body>
  <aside class="sidebar" data-shell="admin" data-active="people"></aside>
  <div class="page">
    <main>
      <div class="page-head"><div><h1>人员与组</h1><p>管理成员、权限分组和登录方式。</p></div><div class="top-actions"><button class="secondary tb-btn tb-btn-secondary" id="open-org" type="button">账号与身份接入</button><button class="secondary tb-btn tb-btn-secondary" id="open-group" type="button">新建分组</button><button class="primary tb-btn tb-btn-primary" id="open-member" type="button">添加成员</button></div></div>
      <div class="tb-tabs people-tabs"><button class="active" data-view="users" type="button">成员</button><button data-view="groups" type="button">权限分组</button></div>
      <section class="toolbar people-toolbar"><label><span>⌕</span><input id="search" placeholder="搜索姓名、邮箱或分组"></label><select class="tb-select" id="status-filter" aria-label="成员状态"><option value="active">在用成员</option><option value="inactive">已停用</option><option value="all">全部成员</option></select></section>
      <section class="section-block" id="users-view" data-view-panel="users"><div class="section-row"><div><h2>成员列表</h2><p class="section-note">分组决定数据组、数据源和内容的访问范围。</p></div><span id="user-count"></span></div><div class="table-shell" id="users"></div></section>
      <section class="section-block" id="groups-view" data-view-panel="groups" hidden><div class="section-row"><div><h2>权限分组</h2><p class="section-note">按组设置权限和项目角色。系统组和同步组的成员由来源方维护。</p></div><span id="group-count"></span></div><div id="groups" class="cards"></div></section>
    </main>
  </div>
  <dialog id="org-dialog" class="tb-modal enterprise-dialog" aria-labelledby="org-dialog-title">
    <form method="dialog">
      <header><div><small>账号与身份接入</small><h2 id="org-dialog-title">组织同步与第三方登录</h2><p>接入平台后，可选择成员的登录方式。</p></div><button class="close" value="cancel" aria-label="关闭">×</button></header>
      <div class="account-access-scroll">
        <section class="enterprise-section">
          <div class="enterprise-section-head"><div><h3>企业组织接入</h3><p>从飞书、钉钉或企业微信同步成员和部门。</p></div><button class="primary tb-btn tb-btn-primary" type="button" data-add-provider="org">接入企业组织</button></div>
          <div id="org-provider-create" class="provider-create" data-provider-create="org" hidden><label class="tb-field">企业平台<select class="tb-select" data-new-provider-type><option value="feishu">飞书</option><option value="dingtalk">钉钉</option><option value="wecom">企业微信</option></select></label><label class="tb-field">接入名称<input class="tb-input" data-new-provider-name value="飞书" placeholder="例如：公司飞书"></label><div class="provider-create-actions"><button class="secondary tb-btn tb-btn-secondary" data-cancel-provider type="button">取消</button><button class="primary tb-btn tb-btn-primary" data-confirm-provider type="button">继续配置</button></div></div>
          <div id="org-providers" class="enterprise-providers"></div>
        </section>
        <section class="enterprise-section">
          <div class="enterprise-section-head"><div><h3>个人第三方登录</h3><p>微信、Google 用于个人账号授权登录，不参与企业组织和部门同步。</p></div><button class="secondary tb-btn tb-btn-secondary" type="button" data-add-provider="login">添加第三方登录</button></div>
          <div id="login-provider-create" class="provider-create" data-provider-create="login" hidden><label class="tb-field">登录平台<select class="tb-select" data-new-provider-type><option value="wechat">微信开放平台</option><option value="google">Google</option></select></label><label class="tb-field">显示名称<input class="tb-input" data-new-provider-name value="微信开放平台" placeholder="例如：公司 Google 登录"></label><div class="provider-create-actions"><button class="secondary tb-btn tb-btn-secondary" data-cancel-provider type="button">取消</button><button class="primary tb-btn tb-btn-primary" data-confirm-provider type="button">继续配置</button></div></div>
          <div id="login-providers" class="enterprise-providers"></div>
        </section>
        <section class="enterprise-section login-policy"><div><h3>允许的登录方式</h3><p id="auth-policy-hint">至少启用一种登录方式。</p></div><div id="login-methods" class="login-methods"></div><span id="login-provider-count" class="login-policy-status"></span></section>
      </div>
      <footer><span class="autosave-note">配置验证成功后自动接入，登录方式实时保存</span><button class="secondary tb-btn tb-btn-secondary" value="cancel">完成</button></footer>
    </form>
  </dialog>
  <div id="toast"></div>
  <script src="/ui.js"></script><script src="/shell.js"></script>
  <script>
    let users=[],groups=[],providers=[],permissionGraph={data_graph:{}},authSettings={password_login_enabled:true,enabled_provider_ids:[]};
    const systemGroup=g=>g.kind!=='manual';
    const initials=name=>(name||'?').trim().slice(0,2).toUpperCase();
    function memberNames(g){return (g.member_ids||[]).map(id=>users.find(u=>u.id===id)?.name||id).join('、')||'暂无成员'}
    function userGroups(user){return groups.filter(g=>(g.member_ids||[]).includes(user.id))}
    function userGroupsHTML(user){const entries=userGroups(user);return entries.length?entries.map(g=>'<span class="group-chip '+(systemGroup(g)?'source':'')+'" translate="no">'+esc(g.name)+'</span>').join(''):'<span class="muted">未分组</span>'}
    function groupPermission(id){return Object.assign({data:'none',sql:'none',collections:'none',admin:'none'},(permissionGraph.data_graph||{})[id]||{})}
    function permissionSummary(group){if(group.id==='grp_admins')return TopbaseLocale.t('系统管理员 · 完整后台权限');const p=groupPermission(group.id);const labels=[];if(p.data!=='none')labels.push(TopbaseLocale.t(p.data==='curate'?'数据管理':'数据浏览'));if(p.sql!=='none')labels.push(TopbaseLocale.t(p.sql==='native'?'原生 SQL':'SQL 查询'));if(p.collections!=='none')labels.push(TopbaseLocale.t(p.collections==='edit'?'编辑内容':'查看内容'));if(p.admin==='admin')labels.push(TopbaseLocale.t('后台管理'));return labels.join(' · ')||TopbaseLocale.t('尚未授予能力')}
    let memberMenus = [];
    function mountMemberMenus() {
      memberMenus.forEach(menu => menu.dispose());
      memberMenus = $$('.member-actions').map(host => {
        const trigger = host.querySelector('summary');
        return TopbaseUI.popover(trigger, trigger.nextElementSibling, {
          onOpen: () => { host.open = true; },
          onClose: () => { host.open = false; }
        });
      });
    }
    function userTable(items){
      const adminIDs=new Set(groups.filter(group=>group.id==='grp_admins'||groupPermission(group.id).admin==='admin').flatMap(group=>group.member_ids||[]));
      if(!items.length)return emptyHTML({title:'没有匹配成员',body:'调整搜索条件，或添加新成员。'});return '<table class="people-table"><thead><tr><th>成员</th><th>邮箱</th><th>所属分组</th><th>最近登录</th><th>状态</th><th><span class="sr-only">操作</span></th></tr></thead><tbody>'+items.map(u=>'<tr><td><div class="person-cell"><span class="person-avatar" translate="no">'+esc(initials(u.name))+'</span><div><strong translate="no">'+esc(u.name)+'</strong><small>'+(adminIDs.has(u.id)?'管理员':'成员')+'</small></div></div></td><td translate="no">'+esc(u.email)+'</td><td><div class="group-chips">'+userGroupsHTML(u)+'</div></td><td class="muted">暂未记录</td><td><span class="status-pill '+(u.is_active===false?'inactive':'')+'">'+(u.is_active===false?'已停用':'在用')+'</span></td><td class="action-cell"><details class="member-actions"><summary class="tb-icon-trigger tb-more-trigger" aria-label="'+esc(TopbaseLocale.t('管理 {name}', {name:u.name}))+'"></summary><div><button type="button" data-user-groups="'+u.id+'">编辑分组</button><button type="button" data-user-password="'+u.id+'">重置密码</button><button type="button" data-user-identity="'+u.id+'">绑定第三方账号</button><button type="button" class="danger" data-user-active="'+u.id+'" data-active="'+(u.is_active!==false)+'">'+(u.is_active===false?'启用成员':'停用成员')+'</button></div></details></td></tr>').join('')+'</tbody></table>'}
    async function load(){[users,groups,providers,permissionGraph,authSettings]=await Promise.all([api('/api/users'),api('/api/groups'),api('/api/identity/providers'),api('/api/permissions/graph'),api('/api/admin/auth-settings')]);permissionGraph.data_graph=permissionGraph.data_graph||{};authSettings.enabled_provider_ids=authSettings.enabled_provider_ids||[];const q=($('#search').value||'').toLowerCase(),status=$('#status-filter').value;const matchedUsers=users.filter(u=>{const matches=(u.name+' '+u.email+' '+userGroups(u).map(g=>g.name).join(' ')).toLowerCase().includes(q);return matches&&(status==='all'||(status==='active'&&u.is_active!==false)||(status==='inactive'&&u.is_active===false));});const matchedGroups=groups.filter(g=>(g.name+' '+memberNames(g)+' '+permissionSummary(g)).toLowerCase().includes(q));$('#user-count').textContent=TopbaseLocale.t('{shown} / {total} 位成员', {shown:matchedUsers.length,total:users.length});$('#group-count').textContent=TopbaseLocale.t('{count} 个分组', {count: groups.length});$('#users').innerHTML=userTable(matchedUsers);mountMemberMenus();$('#groups').innerHTML=matchedGroups.map(g=>cardHTML({title:g.name,meta:TopbaseLocale.t(systemGroup(g)?'系统/同步分组':'手工权限分组')+' · ' + TopbaseLocale.t('{count} 位成员',{count:(g.member_ids||[]).length})+' · '+permissionSummary(g),action:g.id==='grp_admins'?'<span class="muted">系统权限固定</span>':'<button class="secondary tb-btn tb-btn-secondary" data-group="'+g.id+'">管理分组</button>'})).join('')||emptyHTML({title:'没有匹配分组',body:'调整关键词，或新建权限分组。'});$$('[data-user-active]').forEach(b=>b.onclick=()=>setUserActive(b.dataset.userActive,b.dataset.active!=='true'));$$('[data-user-password]').forEach(b=>b.onclick=()=>resetPassword(b.dataset.userPassword));$$('[data-user-groups]').forEach(b=>b.onclick=()=>editUserGroups(b.dataset.userGroups));$$('[data-user-identity]').forEach(b=>b.onclick=()=>bindIdentity(b.dataset.userIdentity));$$('[data-group]').forEach(b=>b.onclick=()=>manageGroup(b.dataset.group));renderEnterpriseAccess()}
    async function setUserActive(id,active){try{await api('/api/users/'+id,'PATCH',{is_active:active});toast(active?'成员已启用':'成员已停用');load()}catch(e){toast(e.message)}}
    async function resetPassword(id){const user=users.find(u=>u.id===id);const v=await formDialog({kicker:'成员管理',title:TopbaseLocale.t('重置“{name}”的密码', {name:user.name}),description:'新密码立即生效，请安全转告成员。',confirmText:'重置密码',fields:[{name:'password',label:'新密码',type:'password',required:true,help:'建议至少使用 8 位，包含字母与数字。'}]});if(!v)return;try{await api('/api/users/'+id+'/password','POST',v);toast('密码已重置')}catch(e){toast(e.message)}}
    async function bindIdentity(id){const available=providers.filter(loginReady);if(!available.length){toast('请先在“账号与身份接入”中添加个人第三方登录');return}const user=users.find(u=>u.id===id);const v=await formDialog({kicker:'成员管理',title:TopbaseLocale.t('绑定“{name}”的第三方账号', {name:user.name}),description:'Google 通常按已验证邮箱自动识别；微信请填写开放平台返回的 OpenID。',confirmText:'保存绑定',fields:[{name:'provider_id',label:'登录平台',type:'select',required:true,options:available.map(p=>({value:p.id,label:p.name,translate:false}))},{name:'subject',label:'外部账号 ID / OpenID',required:true,placeholder:'微信填写 OpenID'}]});if(!v)return;try{await api('/api/users/'+id+'/external-identities','POST',v);toast('第三方账号已绑定')}catch(e){toast(e.message)}}
    async function editUserGroups(id){const user=users.find(u=>u.id===id),manual=groups.filter(g=>!systemGroup(g));const v=await formDialog({kicker:'成员管理',title:TopbaseLocale.t('编辑“{name}”的权限分组', {name:user.name}),description:'在此调整手工分组。系统组和同步组的成员由来源方维护。',size:'wide',confirmText:'保存分组',fields:[{name:'group_ids',label:'手工权限分组',type:'multichoice',value:manual.filter(g=>(g.member_ids||[]).includes(id)).map(g=>g.id),options:manual.map(g=>({value:g.id,label:g.name,translate:false,description:TopbaseLocale.t('{count} 位成员', {count: (g.member_ids||[]).length})}))}]});if(!v)return;try{await api('/api/users/'+id+'/groups','PUT',{group_ids:v.group_ids||[]});toast('成员分组已保存');load()}catch(e){toast(e.message)}}
    async function manageGroup(id){const group=groups.find(g=>g.id===id),p=groupPermission(id),projects=(await api('/api/collections')).filter(x=>x.kind==='team_project');const access=await Promise.all(projects.map(project=>api('/api/projects/'+project.id+'/access')));const fields=[];if(!systemGroup(group))fields.push({name:'member_ids',label:'分组成员',type:'multichoice',value:group.member_ids||[],options:users.map(u=>({value:u.id,label:u.name,translate:false,description:u.email})),help:'成员加入分组后立即继承本页配置的权限。'});fields.push({name:'data',label:'数据浏览',type:'select',value:p.data,options:[{value:'none',label:'无访问'},{value:'view',label:'可浏览'},{value:'curate',label:'可管理'}]},{name:'sql',label:'SQL 查询',type:'select',value:p.sql,options:[{value:'none',label:'禁止'},{value:'query',label:'可查询'},{value:'native',label:'可使用原生 SQL'}]},{name:'collections',label:'内容与数据组',type:'select',value:p.collections,options:[{value:'none',label:'无访问'},{value:'view',label:'可查看'},{value:'edit',label:'可编辑'}]},{name:'admin',label:'后台管理',type:'select',value:p.admin,options:[{value:'none',label:'无'},{value:'admin',label:'允许进入管理后台'}],help:'仅向可信管理员开放后台。'});projects.forEach((project,index)=>{const rule=access[index].find(x=>x.group_id===id);fields.push({name:'project_'+project.id,label:TopbaseLocale.t('数据组 · {name}', {name:project.name}),type:'select',value:rule?rule.role:'none',options:[{value:'none',label:'不授予'},{value:'view',label:'查看'},{value:'edit',label:'编辑'},{value:'manage',label:'管理'}]})});const v=await formDialog({kicker:'权限分组',title:TopbaseLocale.t('管理“{name}”', {name:group.name}),description:systemGroup(group)?'成员由来源系统维护，可在此设置 Topbase 权限。':'一次配置成员、全局能力和团队数据组角色。',size:'wide',confirmText:'保存分组配置',fields});if(!v)return;try{if(!systemGroup(group))await api('/api/groups/'+id+'/members','PUT',{member_ids:v.member_ids||[]});permissionGraph.data_graph[id]={data:v.data,sql:v.sql,collections:v.collections,admin:v.admin};await api('/api/permissions/graph','PUT',permissionGraph);await Promise.all(projects.map((project,index)=>{const kept=access[index].filter(rule=>rule.group_id!==id);if(v['project_'+project.id]!=='none')kept.push({project_id:project.id,group_id:id,role:v['project_'+project.id]});return api('/api/projects/'+project.id+'/access','PUT',kept)}));toast('分组成员与权限已保存');load()}catch(e){toast(e.message)}}
    $('#open-member').onclick=async()=>{const v=await formDialog({kicker:'成员管理',title:'添加成员',description:'创建本地账号后自动加入“所有人”分组。',confirmText:'创建成员',fields:[{name:'name',label:'姓名',required:true},{name:'email',label:'邮箱',type:'email',required:true},{name:'password',label:'初始密码',type:'password',placeholder:'留空则生成临时密码'}]});if(!v)return;try{await api('/api/users','POST',v);toast('成员已创建');load()}catch(e){toast(e.message)}};
    $('#open-group').onclick=async()=>{const name=await promptDialog({kicker:'人员与组',title:'创建权限分组',label:'分组名称',placeholder:'例如：经营分析团队',confirmText:'创建分组'});if(!name)return;try{await api('/api/groups','POST',{name});toast('权限分组已创建');load()}catch(e){toast(e.message)}};
    const platformMeta={feishu:{label:'飞书',mark:'飞',org:true},dingtalk:{label:'钉钉',mark:'钉',org:true},wecom:{label:'企业微信',mark:'企',org:true},wechat:{label:'微信开放平台',mark:'微',login:true},google:{label:'Google',mark:'G',login:true}};
    function providerMeta(type){return platformMeta[type]||{label:type,mark:'企',login:true}}
    function providerReady(p){return !!(p.enabled&&p.client_id&&(p.configured||p.client_secret))}
    function loginReady(p){return !!(providerMeta(p.type).login&&providerReady(p))}
    function collectProvider(id){const card=document.querySelector('[data-provider="'+CSS.escape(id)+'"]'),old=providers.find(p=>p.id===id)||{},next=Object.assign({},old);if(!card)return next;card.querySelectorAll('[data-k]').forEach(el=>next[el.dataset.k]=el.value.trim());next.group_mappings={};(next.mappings||'').split(',').forEach(v=>{const [a,b]=v.split(':');if(a&&b)next.group_mappings[a.trim()]=b.trim()});delete next.mappings;return next}
    function providerCard(p){const meta=providerMeta(p.type),ready=providerReady(p);return '<article class="provider-card" data-provider="'+esc(p.id)+'"><div class="provider-card-head"><span class="provider-mark">'+esc(meta.mark)+'</span><div class="provider-title"><b translate="no">'+esc(p.name)+'</b><small><span>'+esc(meta.label)+'</span><span class="provider-capability">'+(meta.org?'企业组织':'个人授权登录')+'</span></small></div><span class="provider-status '+(ready?'ready':'')+'">'+(ready?'已接入':'待验证')+'</span></div><div class="provider-fields"><label class="tb-field">App ID / Client ID<input class="tb-input" data-k="client_id" value="'+esc(p.client_id||'')+'" placeholder="填写平台应用凭据"></label><label class="tb-field">App Secret / Client Secret<input class="tb-input" data-k="client_secret" type="password" placeholder="'+(p.configured?'已安全保存；留空可重新验证':'填写应用密钥')+'"></label>'+(meta.org?'<label class="wide tb-field">部门到权限分组的映射<textarea class="tb-input" data-k="mappings" placeholder="外部部门ID:Topbase分组ID，每项用逗号分隔">'+esc(Object.entries(p.group_mappings||{}).map(([a,b])=>a+':'+b).join(','))+'</textarea></label>':'')+'</div><div class="provider-card-foot">'+(ready&&meta.org?'<button class="secondary tb-btn tb-btn-secondary" type="button" data-provider-sync="'+esc(p.id)+'">同步组织</button>':'')+'<button class="secondary tb-btn tb-btn-secondary" type="button" data-provider-connect="'+esc(p.id)+'">'+(ready?'重新验证':'验证并接入')+'</button><button class="provider-delete" type="button" data-provider-delete="'+esc(p.id)+'">'+(ready?'删除接入':'取消配置')+'</button></div></article>'}
    function emptyProvider(title,body){return '<div class="provider-empty"><b>'+title+'</b><span>'+body+'</span></div>'}
    function renderLoginMethods(){const ready=providers.filter(loginReady),selected=new Set(authSettings.enabled_provider_ids||[]);$('#login-methods').innerHTML='<label class="login-method"><input type="checkbox" data-login-method="password" '+(authSettings.password_login_enabled?'checked':'')+'><span class="provider-mark">密</span><span><b>账号密码</b><small>Topbase 本地邮箱和密码</small></span></label>'+ready.map(p=>'<label class="login-method"><input type="checkbox" data-login-method="'+esc(p.id)+'" '+(selected.has(p.id)?'checked':'')+'><span class="provider-mark">'+esc(providerMeta(p.type).mark)+'</span><span><b translate="no">'+esc(p.name)+'</b><small>'+esc(TopbaseLocale.t('{provider} 授权登录', {provider:TopbaseLocale.t(providerMeta(p.type).label)}))+'</small></span></label>').join('');const enabled=(authSettings.password_login_enabled?1:0)+ready.filter(p=>selected.has(p.id)).length;$('#login-provider-count').textContent=TopbaseLocale.t('当前启用 {count} 种登录方式', {count: enabled});$$('[data-login-method]').forEach(input=>input.onchange=()=>saveLoginMethods(input))}
    function renderEnterpriseAccess(){if(!$('#org-providers'))return;const org=providers.filter(p=>providerMeta(p.type).org),login=providers.filter(p=>providerMeta(p.type).login);$('#org-providers').innerHTML=org.map(providerCard).join('')||emptyProvider('尚未接入企业组织','接入后可同步成员、部门并映射权限分组。');$('#login-providers').innerHTML=login.map(providerCard).join('')||emptyProvider('尚未添加第三方登录','微信和 Google 仅用于个人账号授权登录。');$$('[data-provider-connect]').forEach(b=>b.onclick=()=>connectProvider(b.dataset.providerConnect));$$('[data-provider-sync]').forEach(b=>b.onclick=()=>syncProvider(b.dataset.providerSync));$$('[data-provider-delete]').forEach(b=>b.onclick=()=>deleteProvider(b));renderLoginMethods()}
    async function syncProvider(id){const provider=providers.find(p=>p.id===id);try{const synced=await api('/api/identity/providers/'+encodeURIComponent(id)+'/sync','POST',{});toast(TopbaseLocale.t('{name} 已同步 {count} 个部门', {name:provider?.name||TopbaseLocale.t('企业平台'),count:synced.length||0}));load()}catch(e){toast(e.message)}}
    async function connectProvider(id){const draft=collectProvider(id),wasReady=providerReady(providers.find(p=>p.id===id)),button=document.querySelector('[data-provider-connect="'+CSS.escape(id)+'"]');button.disabled=true;button.textContent='正在验证…';try{await api('/api/identity/providers/validate','POST',draft);const saved=await api('/api/identity/providers/'+encodeURIComponent(id),'PUT',Object.assign({},draft,{enabled:true}));const index=providers.findIndex(p=>p.id===id);if(index<0)providers.push(saved);else providers[index]=saved;authSettings.enabled_provider_ids=authSettings.enabled_provider_ids||[];if(providerMeta(saved.type).login&&!authSettings.enabled_provider_ids.includes(saved.id)){authSettings.enabled_provider_ids.push(saved.id);authSettings=await api('/api/admin/auth-settings','PUT',authSettings)}toast('配置验证成功，已自动接入');renderEnterpriseAccess()}catch(e){toast(TopbaseLocale.t('验证失败：{error}', {error:e.message}));button.disabled=false;button.textContent=wasReady?'重新验证':'验证并接入'}}
    let pendingDelete='';async function deleteProvider(button){const id=button.dataset.providerDelete,provider=providers.find(p=>p.id===id);if(!providerReady(provider)){providers=providers.filter(p=>p.id!==id);renderEnterpriseAccess();return}if(pendingDelete!==id){pendingDelete=id;button.textContent='再次点击确认删除';button.classList.add('confirming');setTimeout(()=>{if(pendingDelete===id){pendingDelete='';renderEnterpriseAccess()}},3500);return}try{await api('/api/identity/providers/'+encodeURIComponent(id),'DELETE');pendingDelete='';toast('接入已删除');await load()}catch(e){pendingDelete='';toast(e.message);renderEnterpriseAccess()}}
    async function saveLoginMethods(changed){const checked=$$('[data-login-method]:checked').map(input=>input.dataset.loginMethod);if(!checked.length){changed.checked=true;toast('必须至少保留一种登录方式');return}const next={password_login_enabled:checked.includes('password'),enabled_provider_ids:checked.filter(id=>id!=='password')};try{authSettings=await api('/api/admin/auth-settings','PUT',next);toast('登录方式已实时保存');renderLoginMethods()}catch(e){toast(e.message);renderLoginMethods()}}
    const orgDialog = TopbaseUI.modal('#org-dialog');
    $('#open-org').onclick=()=>{$$('[data-provider-create]').forEach(panel=>panel.hidden=true);renderEnterpriseAccess();orgDialog.open({from:$('#open-org')})};
    $$('[data-add-provider]').forEach(button=>button.onclick=()=>{const panel=document.querySelector('[data-provider-create="'+button.dataset.addProvider+'"]');panel.hidden=false;panel.querySelector('select').focus()});
    $$('[data-cancel-provider]').forEach(button=>button.onclick=()=>button.closest('[data-provider-create]').hidden=true);
    $$('[data-new-provider-name]').forEach(input=>{input.value=TopbaseLocale.t(input.defaultValue)});
    $$('[data-new-provider-type]').forEach(select=>select.onchange=()=>select.closest('[data-provider-create]').querySelector('[data-new-provider-name]').value=TopbaseLocale.t(providerMeta(select.value).label));
    $$('[data-confirm-provider]').forEach(button=>button.onclick=()=>{const panel=button.closest('[data-provider-create]'),type=panel.querySelector('[data-new-provider-type]').value,name=panel.querySelector('[data-new-provider-name]').value.trim();if(!name)return toast('请填写接入名称');const draft={id:'idp_'+Math.random().toString(36).slice(2,9),type,name,enabled:false,configured:false,group_mappings:{}};providers.push(draft);panel.hidden=true;renderEnterpriseAccess();document.querySelector('[data-provider="'+CSS.escape(draft.id)+'"]')?.scrollIntoView({block:'nearest'})});
    TopbaseTabs.mount('.people-tabs',{tabSelector:'[data-view]',panelSelector:'[data-view-panel]',tabValue:b=>b.dataset.view,panelValue:p=>p.dataset.viewPanel,onChange:view=>{$('.people-toolbar').hidden=view!=='users'}});$('#search').oninput=load;$('#status-filter').onchange=load;
    load().catch(e=>toast(e.message));
  </script>
</body>
</html>
