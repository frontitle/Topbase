<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 人员与组</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <aside class="sidebar" data-shell="admin" data-active="people"></aside>
  <div class="page">
    <header class="topbar"><strong>管理后台</strong><span>/</span><strong>人员与组</strong></header>
    <main>
      <div class="page-head"><div><h1>人员与组</h1><p>在这里管理成员账号、权限分组和办公平台组织同步。</p></div><div class="top-actions"><button class="secondary" id="open-org" type="button">组织绑定</button><button class="secondary" id="open-group" type="button">新建分组</button><button class="primary" id="open-member" type="button">添加成员</button></div></div>
      <div class="people-tabs" role="tablist"><button class="people-tab active" data-view="users" type="button">成员</button><button class="people-tab" data-view="groups" type="button">权限分组</button></div>
      <section class="toolbar people-toolbar"><label><span>⌕</span><input id="search" placeholder="搜索姓名、邮箱或分组"></label><select id="status-filter" aria-label="成员状态"><option value="active">在用成员</option><option value="inactive">已停用</option><option value="all">全部成员</option></select></section>
      <section class="section-block" id="users-view"><div class="section-row"><div><h2>成员列表</h2><p class="section-note">分组决定数据组、数据源和内容的访问范围。</p></div><span id="user-count"></span></div><div class="table-shell" id="users"></div></section>
      <section class="section-block" id="groups-view" hidden><div class="section-row"><div><h2>权限分组</h2><p class="section-note">每个分组统一管理成员、全局能力和团队数据组角色；系统与同步分组只锁定成员来源。</p></div><span id="group-count"></span></div><div id="groups" class="cards"></div></section>
    </main>
  </div>
  <dialog id="org-dialog"><form method="dialog"><header><div><small>组织绑定</small><h2>办公平台与组织同步</h2><p>将飞书、钉钉、企业微信的外部部门映射为权限分组，也可配置微信和 Google 登录。</p></div><button class="close" value="cancel">×</button></header><div class="read-only"><label><input id="password-login-enabled" type="checkbox" checked> 保留邮箱与密码登录</label><p>关闭前必须至少启用并填写一个第三方登录的应用凭据。该设置会被后端强制执行。</p><button class="secondary" type="button" id="save-auth-settings">保存登录策略</button></div><div id="providers" class="cards"></div><footer><button class="secondary" type="button" id="sync-feishu">同步飞书部门</button><button class="primary" type="button" id="add-provider">接入办公平台</button></footer></form></dialog>
  <div id="toast"></div>
  <script src="/ui.js"></script><script src="/shell.js"></script>
  <script>
    let users=[],groups=[],providers=[],permissionGraph={data_graph:{}},authSettings={password_login_enabled:true};
    const systemGroup=g=>g.kind!=='manual';
    const initials=name=>(name||'?').trim().slice(0,2).toUpperCase();
    function memberNames(g){return (g.member_ids||[]).map(id=>users.find(u=>u.id===id)?.name||id).join('、')||'暂无成员'}
    function userGroups(user){return groups.filter(g=>(g.member_ids||[]).includes(user.id))}
    function userGroupsHTML(user){const entries=userGroups(user);return entries.length?entries.map(g=>'<span class="group-chip '+(systemGroup(g)?'source':'')+'">'+esc(g.name)+'</span>').join(''):'<span class="muted">未分组</span>'}
    function groupPermission(id){return Object.assign({data:'none',sql:'none',collections:'none',admin:'none'},(permissionGraph.data_graph||{})[id]||{})}
    function permissionSummary(group){if(group.id==='grp_admins')return '系统管理员 · 完整后台权限';const p=groupPermission(group.id);const labels=[];if(p.data!=='none')labels.push('数据 '+(p.data==='curate'?'管理':'浏览'));if(p.sql!=='none')labels.push(p.sql==='native'?'原生 SQL':'SQL 查询');if(p.collections!=='none')labels.push('内容 '+(p.collections==='edit'?'编辑':'查看'));if(p.admin==='admin')labels.push('后台管理');return labels.join(' · ')||'尚未授予能力'}
    function userTable(items){if(!items.length)return emptyHTML({title:'没有匹配成员',body:'调整搜索条件，或添加新成员。'});return '<table class="people-table"><thead><tr><th>成员</th><th>邮箱</th><th>所属分组</th><th>最近登录</th><th>状态</th><th><span class="sr-only">操作</span></th></tr></thead><tbody>'+items.map(u=>'<tr><td><div class="person-cell"><span class="person-avatar">'+esc(initials(u.name))+'</span><div><strong>'+esc(u.name)+'</strong><small>'+((u.is_admin)?'管理员':'成员')+'</small></div></div></td><td>'+esc(u.email)+'</td><td><div class="group-chips">'+userGroupsHTML(u)+'</div></td><td class="muted">暂未记录</td><td><span class="status-pill '+(u.is_active===false?'inactive':'')+'">'+(u.is_active===false?'已停用':'在用')+'</span></td><td class="action-cell"><details class="member-actions"><summary aria-label="管理 '+esc(u.name)+'">•••</summary><div><button type="button" data-user-groups="'+u.id+'">编辑分组</button><button type="button" data-user-password="'+u.id+'">重置密码</button><button type="button" data-user-identity="'+u.id+'">绑定第三方账号</button><button type="button" class="danger" data-user-active="'+u.id+'" data-active="'+(u.is_active!==false)+'">'+(u.is_active===false?'启用成员':'停用成员')+'</button></div></details></td></tr>').join('')+'</tbody></table>'}
    async function load(){[users,groups,providers,permissionGraph,authSettings]=await Promise.all([api('/api/users'),api('/api/groups'),api('/api/identity/providers'),api('/api/permissions/graph'),api('/api/admin/auth-settings')]);permissionGraph.data_graph=permissionGraph.data_graph||{};$('#password-login-enabled').checked=authSettings.password_login_enabled;const q=($('#search').value||'').toLowerCase(),status=$('#status-filter').value;const matchedUsers=users.filter(u=>{const matches=(u.name+' '+u.email+' '+userGroups(u).map(g=>g.name).join(' ')).toLowerCase().includes(q);return matches&&(status==='all'||(status==='active'&&u.is_active!==false)||(status==='inactive'&&u.is_active===false));});const matchedGroups=groups.filter(g=>(g.name+' '+memberNames(g)+' '+permissionSummary(g)).toLowerCase().includes(q));$('#user-count').textContent=matchedUsers.length+' / '+users.length+' 位成员';$('#group-count').textContent=groups.length+' 个分组';$('#users').innerHTML=userTable(matchedUsers);$('#groups').innerHTML=matchedGroups.map(g=>cardHTML({title:g.name,meta:(systemGroup(g)?'系统/同步分组':'手工权限分组')+' · '+(g.member_ids||[]).length+' 位成员 · '+permissionSummary(g),action:g.id==='grp_admins'?'<span class="muted">系统权限固定</span>':'<button class="secondary" data-group="'+g.id+'">管理分组</button>'})).join('')||emptyHTML({title:'没有匹配分组',body:'调整关键词，或新建权限分组。'});$$('[data-user-active]').forEach(b=>b.onclick=()=>setUserActive(b.dataset.userActive,b.dataset.active!=='true'));$$('[data-user-password]').forEach(b=>b.onclick=()=>resetPassword(b.dataset.userPassword));$$('[data-user-groups]').forEach(b=>b.onclick=()=>editUserGroups(b.dataset.userGroups));$$('[data-user-identity]').forEach(b=>b.onclick=()=>bindIdentity(b.dataset.userIdentity));$$('[data-group]').forEach(b=>b.onclick=()=>manageGroup(b.dataset.group));$('#providers').innerHTML=providers.map(providerCard).join('')||emptyHTML({title:'尚未绑定组织',body:'接入飞书、钉钉、企业微信、微信或 Google 后，可将部门或外部组映射为 Topbase 权限分组。'});$$('[data-provider-save]').forEach(b=>b.onclick=()=>saveProviders())}
    async function setUserActive(id,active){try{await api('/api/users/'+id,'PATCH',{is_active:active});toast(active?'成员已启用':'成员已停用');load()}catch(e){toast(e.message)}}
    async function resetPassword(id){const user=users.find(u=>u.id===id);const v=await formDialog({kicker:'成员管理',title:'重置“'+user.name+'”的密码',description:'新密码会立即生效，请通过安全渠道告知成员。',confirmText:'重置密码',fields:[{name:'password',label:'新密码',type:'password',required:true,help:'建议至少使用 8 位，包含字母与数字。'}]});if(!v)return;try{await api('/api/users/'+id+'/password','POST',v);toast('密码已重置')}catch(e){toast(e.message)}}
    async function bindIdentity(id){const available=providers.filter(p=>p.type==='wechat'||p.type==='google');if(!available.length){toast('请先在组织绑定中添加微信或 Google 平台');return}const user=users.find(u=>u.id===id);const v=await formDialog({kicker:'成员管理',title:'绑定“'+user.name+'”的第三方账号',description:'Google 通常按已验证邮箱自动识别；微信请填写开放平台返回的 OpenID。',confirmText:'保存绑定',fields:[{name:'provider_id',label:'登录平台',type:'select',required:true,options:available.map(p=>({value:p.id,label:p.name}))},{name:'subject',label:'外部账号 ID / OpenID',required:true,placeholder:'微信填写 OpenID'}]});if(!v)return;try{await api('/api/users/'+id+'/external-identities','POST',v);toast('第三方账号已绑定')}catch(e){toast(e.message)}}
    async function editUserGroups(id){const user=users.find(u=>u.id===id),manual=groups.filter(g=>!systemGroup(g));const v=await formDialog({kicker:'成员管理',title:'编辑“'+user.name+'”的权限分组',description:'这里只维护手工分组；所有人、管理员和组织同步分组保持其原有来源。',size:'wide',confirmText:'保存分组',fields:[{name:'group_ids',label:'手工权限分组',type:'multichoice',value:manual.filter(g=>(g.member_ids||[]).includes(id)).map(g=>g.id),options:manual.map(g=>({value:g.id,label:g.name,description:(g.member_ids||[]).length+' 位成员'}))}]});if(!v)return;try{await api('/api/users/'+id+'/groups','PUT',{group_ids:v.group_ids||[]});toast('成员分组已保存');load()}catch(e){toast(e.message)}}
    async function manageGroup(id){const group=groups.find(g=>g.id===id),p=groupPermission(id),projects=(await api('/api/collections')).filter(x=>x.kind==='team_project');const access=await Promise.all(projects.map(project=>api('/api/projects/'+project.id+'/access')));const fields=[];if(!systemGroup(group))fields.push({name:'member_ids',label:'分组成员',type:'multichoice',value:group.member_ids||[],options:users.map(u=>({value:u.id,label:u.name,description:u.email})),help:'成员加入分组后立即继承本页配置的权限。'});fields.push({name:'data',label:'数据浏览',type:'select',value:p.data,options:[{value:'none',label:'无访问'},{value:'view',label:'可浏览'},{value:'curate',label:'可管理'}]},{name:'sql',label:'SQL 查询',type:'select',value:p.sql,options:[{value:'none',label:'禁止'},{value:'query',label:'可查询'},{value:'native',label:'可使用原生 SQL'}]},{name:'collections',label:'内容与数据组',type:'select',value:p.collections,options:[{value:'none',label:'无访问'},{value:'view',label:'可查看'},{value:'edit',label:'可编辑'}]},{name:'admin',label:'后台管理',type:'select',value:p.admin,options:[{value:'none',label:'无'},{value:'admin',label:'允许进入管理后台'}],help:'授予后台管理后，成员可进入管理后台；请仅分配给可信管理员。'});projects.forEach((project,index)=>{const rule=access[index].find(x=>x.group_id===id);fields.push({name:'project_'+project.id,label:'数据组 · '+project.name,type:'select',value:rule?rule.role:'none',options:[{value:'none',label:'不授予'},{value:'view',label:'查看'},{value:'edit',label:'编辑'},{value:'manage',label:'管理'}]})});const v=await formDialog({kicker:'权限分组',title:'管理“'+group.name+'”',description:systemGroup(group)?'这是系统或组织同步分组，成员由来源系统维护；可在这里配置其 Topbase 授权。':'一次配置成员、全局能力和团队数据组角色。',size:'wide',confirmText:'保存分组配置',fields});if(!v)return;try{if(!systemGroup(group))await api('/api/groups/'+id+'/members','PUT',{member_ids:v.member_ids||[]});permissionGraph.data_graph[id]={data:v.data,sql:v.sql,collections:v.collections,admin:v.admin};await api('/api/permissions/graph','PUT',permissionGraph);await Promise.all(projects.map((project,index)=>{const kept=access[index].filter(rule=>rule.group_id!==id);if(v['project_'+project.id]!=='none')kept.push({project_id:project.id,group_id:id,role:v['project_'+project.id]});return api('/api/projects/'+project.id+'/access','PUT',kept)}));toast('分组成员与权限已保存');load()}catch(e){toast(e.message)}}
    $('#open-member').onclick=async()=>{const v=await formDialog({kicker:'成员管理',title:'添加成员',description:'创建本地账号后自动加入“所有人”分组。',confirmText:'创建成员',fields:[{name:'name',label:'姓名',required:true},{name:'email',label:'邮箱',type:'email',required:true},{name:'password',label:'初始密码',type:'password',placeholder:'留空则生成临时密码'}]});if(!v)return;try{await api('/api/users','POST',v);toast('成员已创建');load()}catch(e){toast(e.message)}};
    $('#sync-feishu').onclick=async()=>{try{const synced=await api('/api/feishu/departments/sync','POST',{});toast('已同步 '+(synced.length||0)+' 个部门');load()}catch(e){toast(e.message)}};
    $('#open-group').onclick=async()=>{const name=await promptDialog({kicker:'人员与组',title:'创建权限分组',label:'分组名称',placeholder:'例如：经营分析团队',confirmText:'创建分组'});if(!name)return;try{await api('/api/groups','POST',{name});toast('权限分组已创建');load()}catch(e){toast(e.message)}};
    $('#open-org').onclick=()=>$('#org-dialog').showModal();$('#save-auth-settings').onclick=async()=>{try{authSettings=await api('/api/admin/auth-settings','PUT',{password_login_enabled:$('#password-login-enabled').checked});toast('登录策略已保存')}catch(e){toast(e.message);$('#password-login-enabled').checked=authSettings.password_login_enabled}};$$('.people-tab').forEach(b=>b.onclick=()=>{$$('.people-tab').forEach(x=>x.classList.toggle('active',x===b));$('#users-view').hidden=b.dataset.view!=='users';$('#groups-view').hidden=b.dataset.view!=='groups';$('.people-toolbar').hidden=b.dataset.view!=='users'});$('#search').oninput=load;$('#status-filter').onchange=load;
    function providerCard(p){return '<article class="db-card" data-provider="'+p.id+'"><b>'+esc(p.name)+'</b><small>'+esc(p.type)+' · '+(p.enabled?'已启用':'未启用')+'</small><div class="fields"><label>Client ID<input data-k="client_id" value="'+esc(p.client_id||'')+'"></label><label>Client Secret<input data-k="client_secret" type="password" placeholder="留空保持不变"></label><label>外部组 → 权限分组<input data-k="mappings" value="'+esc(Object.entries(p.group_mappings||{}).map(([a,b])=>a+':'+b).join(','))+'" placeholder="外部组ID:grp_xxx"></label><label><span>启用</span><input data-k="enabled" type="checkbox" '+(p.enabled?'checked':'')+'></label></div><div class="card-foot"><button class="secondary" data-provider-save="'+p.id+'">保存绑定</button></div></article>'}
    $('#add-provider').onclick=async()=>{const v=await formDialog({kicker:'身份平台',title:'添加身份与组织平台',description:'Google 支持已存在工作邮箱登录；微信使用 OpenID 预绑定登录。',confirmText:'添加平台',fields:[{name:'type',label:'平台',type:'select',value:'feishu',required:true,options:[{value:'feishu',label:'飞书'},{value:'dingtalk',label:'钉钉'},{value:'wecom',label:'企业微信'},{value:'wechat',label:'微信开放平台'},{value:'google',label:'Google'}]},{name:'name',label:'显示名称',value:'飞书',placeholder:'例如：公司 Google Workspace',required:true}]});if(!v)return;providers.push({id:'idp_'+Math.random().toString(36).slice(2,9),type:v.type,name:v.name,enabled:true,group_mappings:{}});await saveProviders()};
    async function saveProviders(){const cards=$$('[data-provider]');providers=cards.map(c=>{const old=providers.find(p=>p.id===c.dataset.provider),next=Object.assign({},old);c.querySelectorAll('[data-k]').forEach(el=>next[el.dataset.k]=el.type==='checkbox'?el.checked:el.value.trim());next.group_mappings={};(next.mappings||'').split(',').forEach(v=>{const [a,b]=v.split(':');if(a&&b)next.group_mappings[a.trim()]=b.trim()});delete next.mappings;return next});try{await api('/api/identity/providers','PUT',providers);toast('组织绑定已保存');load()}catch(e){toast(e.message)}}
    load().catch(e=>toast(e.message));
  </script>
</body>
</html>
