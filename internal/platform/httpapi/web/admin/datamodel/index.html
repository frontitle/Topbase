<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/admin.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 数据模型</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/admin/datamodel/datamodel.css">
</head>
<body>
  <aside class="sidebar" data-shell="admin" data-active="datamodel"></aside>
  <div class="page">
    <main>
      <div class="page-head">
        <div>
          <h1>数据模型</h1>
          <p>设置工作台使用的表和字段别称、说明、语义及外键。</p>
        </div>
      </div>
      <nav class="tb-tabs model-source-tabs" aria-label="数据模型范围"><button class="active" type="button" data-model-source="remote">远程数据源</button><button type="button" data-model-source="local">本地数仓</button></nav>
      <div class="schema-layout">
        <aside class="schema-tables">
          <div class="table-browser-head">
            <label class="side-select tb-field">数据源<select class="tb-select" id="database"></select></label>
            <input class="tb-input" id="search" placeholder="搜索表">
            <div class="side-title">数据表 <span id="table-count"></span></div>
          </div>
          <div class="table-list-scroll" tabindex="0" aria-label="数据表列表">
            <div id="table-list">先选择数据源。</div>
          </div>
        </aside>
        <section class="schema-fields" id="editor">
          <div id="empty-editor">
            <h2>选择一张表</h2>
            <p>在 Topbase 中设置表名、字段别称和语义。</p>
          </div>
          <div id="meta-editor" hidden>
            <header class="table-head">
              <div>
                <small id="physical-name" translate="no"></small>
                <h2 class="editor-title-row"><span id="editor-title" translate="no">表元数据</span><button id="editor-visibility" class="editor-eye" type="button" aria-label="切换前台可见性" title="切换前台可见性"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button></h2><p id="source-description" translate="no" class="source-comment" title=""></p>
              </div>
            </header>
            <div class="meta-grid">
              <label class="tb-field">表显示名称（别称）<input class="tb-input" id="display-name" placeholder="例如：订单明细"></label>
              <label class="full tb-field">业务备注<textarea class="tb-input" id="description" placeholder="例如：统计口径、用途或更新频率"></textarea><small class="metadata-hint">工作台优先显示业务备注。</small></label>
            </div>
            <div class="field-heading"><h3>字段</h3><button id="toggle-field-fullscreen" class="field-fullscreen-button" type="button" aria-pressed="false" title="全屏编辑字段"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg><span>全屏编辑</span><kbd>Esc</kbd></button></div>
            <div class="field-scroll">
              <table class="fields-table" id="field-table">
                <thead>
                  <tr>
                    <th>物理名</th>
                    <th>别称</th>
                    <th>类型</th>
                    <th>字段说明</th>
                    <th>语义</th>
                    <th>外键表</th>
                    <th>外键字段</th>
                    <th>可见性</th>
                  </tr>
                </thead>
                <tbody id="field-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script src="/admin/datamodel/datamodel.js"></script>
</body>
</html>
