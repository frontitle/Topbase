<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topbase · 嵌入</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/ui.css"></head><body><aside class="sidebar" data-shell="admin" data-active="embedding"></aside><div class="page"><header class="topbar"><strong>管理后台</strong><span>/</span><strong>嵌入与公开链接</strong></header><main><div class="page-head"><div><h1>嵌入与公开链接</h1><p>全局策略控制已发布仪表盘的公开链接与 iframe 嵌入访问。</p></div><a class="secondary" href="/admin/settings/">配置全局开关</a></div><section class="section-block"><h2>访问策略</h2><div id="policy" class="cards"></div></section><section class="section-block"><h2>已公开的仪表盘</h2><div id="boards" class="cards"></div></section></main></div><div id="toast"></div><script src="/ui.js"></script><script src="/shell.js"></script><script>const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');async function load(){const[s,boards]=await Promise.all([api('/api/admin/settings'),api('/api/dashboards')]);$('#policy').innerHTML=cardHTML({title:s.public_sharing_enabled?'公开链接已启用':'公开链接已关闭',meta:'iframe 嵌入：'+(s.embedding_enabled?'已启用':'已关闭')});const open=boards.filter(x=>x.public_uuid);$('#boards').innerHTML=open.map(x=>cardHTML({title:x.name,meta:'令牌 '+x.public_uuid,href:'/dashboard/'+x.id+'/'})).join('')||emptyHTML({title:'暂无公开仪表盘',body:'在仪表盘的分享菜单中创建公开链接。'})}load().catch(e=>toast(e.message));</script></body></html>
