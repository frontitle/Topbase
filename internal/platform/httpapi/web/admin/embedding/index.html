<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/admin.js"></script>
  <script src="/locales/analytics.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topbase · 嵌入</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/ui.css"></head><body><aside class="sidebar" data-shell="admin" data-active="embedding"></aside><div class="page"><main><div class="page-head"><div><h1>嵌入与公开链接</h1><p>全局策略控制已发布仪表盘的公开链接与 iframe 嵌入访问。</p></div><a class="secondary tb-btn tb-btn-secondary" href="/admin/settings/">配置全局开关</a></div><section class="section-block"><h2>访问策略</h2><div id="policy" class="cards"></div></section><section class="section-block"><h2>已设置公开链接的仪表盘</h2><div id="boards" class="cards"></div></section></main></div><div id="toast"></div><script src="/ui.js"></script><script src="/dashboard-share-status.js"></script><script src="/shell.js"></script><script>const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');async function load(){const[s,boards]=await Promise.all([api('/api/admin/settings'),api('/api/dashboards')]);$('#policy').innerHTML=cardHTML({titleTranslate:true,title:s.public_sharing_enabled?'公开链接已启用':'公开链接已关闭',meta:TopbaseLocale.t(s.embedding_enabled?'iframe 嵌入已启用':'iframe 嵌入已关闭')});const open=boards.filter(x=>x.public_uuid);$('#boards').innerHTML=open.map(x=>cardHTML({title:x.name,meta:dashboardShareStatus(x)==='expired'?'分享已到期':x.public_expires_at?TopbaseLocale.t('有效至 {date}', {date:new Date(x.public_expires_at).toLocaleString(TopbaseLocale.locale())}):'永久有效',href:'/dashboard/'+x.id+'/'})).join('')||emptyHTML({title:'暂无公开仪表盘',body:'在仪表盘的分享菜单中创建公开链接。'})}load().catch(e=>toast(e.message));</script></body></html>
