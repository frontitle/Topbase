<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topbase · 监控与任务</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/ui.css?v=sidebar-compact-2"><link rel="stylesheet" href="/admin/monitor/monitor.css?v=1"></head><body><aside class="sidebar" data-shell="admin" data-active="monitor"></aside><div class="page"><header class="topbar"><strong>管理后台</strong><span>/</span><strong>监控与任务</strong></header><main class="monitor-page"><div class="page-head"><div><h1>监控与任务</h1><p>查看数仓定时分析与仪表盘订阅的执行情况；可筛选、验证、停用或删除订阅。</p></div><button class="secondary" id="refresh">刷新</button></div><section class="monitor-summary" id="summary"></section><section class="section-block"><div class="section-row"><div><h2>数仓定时分析</h2><span>最近一次执行与当前调度状态</span></div><div class="filters"><select id="schedule-filter"><option value="all">全部状态</option><option value="enabled">仅启用</option><option value="disabled">仅停用</option></select><input id="schedule-search" placeholder="搜索任务名称"></div></div><div class="table-wrap"><table class="monitor-table"><thead><tr><th>任务</th><th>计划</th><th>最近运行</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody id="schedules"></tbody></table></div></section><section class="section-block"><div class="section-row"><div><h2>Webhook 与订阅通知</h2><span>可直接验证推送、暂停或删除订阅</span></div><div class="filters"><select id="subscription-filter"><option value="all">全部状态</option><option value="enabled">仅启用</option><option value="disabled">仅停用</option></select><input id="subscription-search" placeholder="搜索仪表盘或通道"></div></div><div class="table-wrap"><table class="monitor-table"><thead><tr><th>仪表盘订阅</th><th>推送通道</th><th>计划</th><th>最近验证</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody id="subscriptions"></tbody></table></div></section><section class="section-block"><h2>近期调度运行</h2><div class="table-wrap"><table class="monitor-table"><thead><tr><th>任务</th><th>状态</th><th>开始时间</th><th>详情</th></tr></thead><tbody id="runs"></tbody></table></div></section></main></div><div id="toast"></div><script src="/ui.js"></script><script src="/shell.js"></script><script src="/admin/monitor/monitor.js?v=2"></script></body></html>
