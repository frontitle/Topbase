<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topbase · 监控</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/ui.css"></head><body><aside class="sidebar" data-shell="admin" data-active="monitor"></aside><div class="page"><header class="topbar"><strong>管理后台</strong><span>/</span><strong>监控与任务</strong></header><main><div class="page-head"><div><h1>监控与任务</h1><p>集中查看数据仓调度、运行记录、告警和仪表盘订阅；可手动触发验证。</p></div><button class="secondary" id="refresh">刷新</button></div><section class="section-block"><h2>调度运行</h2><div class="table-wrap"><table class="fields-table"><thead><tr><th>调度</th><th>状态</th><th>开始时间</th><th>详情</th></tr></thead><tbody id="runs"></tbody></table></div></section><section class="section-block"><h2>数据仓调度</h2><div id="schedules" class="cards"></div></section><section class="section-block"><h2>告警与订阅</h2><div id="delivery" class="cards"></div></section></main></div><div id="toast"></div><script src="/ui.js"></script><script src="/shell.js"></script><script>const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&quot;').replace(/</g,'&lt;');const fmt=v=>v?new Date(v).toLocaleString('zh-CN'):'—';async function load(){const d=await api('/api/admin/monitor');$('#runs').innerHTML=d.runs.map(x=>'<tr><td>'+esc(x.schedule_id)+'</td><td>'+esc(x.status||'完成')+'</td><td>'+fmt(x.started_at)+'</td><td>'+esc(x.error||x.message||'—')+'</td></tr>').join('')||'<tr><td colspan="4">暂无运行记录</td></tr>';$('#schedules').innerHTML=d.schedules.map(x=>cardHTML({title:x.name||x.id,meta:(x.cron||'—')+' · '+(x.enabled?'启用':'停用'),footer:'<button class="secondary" data-run-schedule="'+x.id+'">立即运行</button>'})).join('')||emptyHTML({title:'暂无调度',body:'可在数仓页面从保存的分析创建调度。'});$('#delivery').innerHTML=[...d.alerts.map(x=>({kind:'告警',id:x.id,name:x.name,channel:x.channel,enabled:x.enabled})),...d.subscriptions.map(x=>({kind:'仪表盘订阅',id:x.id,name:x.dashboard_id,channel:x.channel,enabled:x.enabled}))].map(x=>cardHTML({title:x.kind+' · '+x.name,meta:x.channel+' · '+(x.enabled?'启用':'停用'),footer:'<button class="secondary" data-run-'+(x.kind==='告警'?'alert':'subscription')+'="'+x.id+'">立即发送</button>'})).join('')||emptyHTML({title:'暂无告警或订阅',body:'在分析或仪表盘中创建通知。'});$$('[data-run-schedule]').forEach(b=>b.onclick=()=>run('/api/schedules/'+b.dataset.runSchedule+'/run'));$$('[data-run-alert]').forEach(b=>b.onclick=()=>run('/api/alerts/'+b.dataset.runAlert+'/run'));$$('[data-run-subscription]').forEach(b=>b.onclick=()=>run('/api/subscriptions/'+b.dataset.runSubscription+'/run'))}async function run(path){try{await api(path,'POST',{});toast('任务已触发');load()}catch(e){toast(e.message)}}$('#refresh').onclick=load;load().catch(e=>toast(e.message));</script></body></html>
