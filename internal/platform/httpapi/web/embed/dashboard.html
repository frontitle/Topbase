<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/analytics.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 仪表盘</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/grid.css">
  <link rel="stylesheet" href="/viz.css">
  <link rel="stylesheet" href="/embed/access.css">
</head>
<body class="embed-page">
  <main class="share-access" id="share-access" aria-labelledby="share-access-title">
    <section class="share-access-card">
      <label class="locale-picker"><span class="locale-label">界面语言</span><select class="tb-select" aria-label="界面语言" data-locale-picker><option value="zh-CN" lang="zh-CN" translate="no">简体中文</option><option value="en" lang="en" translate="no">English</option></select></label>
      <svg class="share-access-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="/vendor/lucide-nav.svg#shield-check"></use></svg>
      <h1 id="share-access-title">正在打开仪表盘</h1>
      <p id="share-access-message" role="status"></p>
      <form id="share-access-form" hidden>
        <label class="tb-field" for="share-access-password">访问密码</label>
        <input class="tb-input" id="share-access-password" type="password" autocomplete="current-password" required aria-describedby="share-access-error">
        <p id="share-access-error" role="alert" hidden></p>
        <button class="tb-btn tb-btn-primary" type="submit">查看仪表盘</button>
      </form>
      <button class="tb-btn tb-btn-secondary" id="share-access-retry" type="button" hidden>重新加载</button>
      <noscript>请启用 JavaScript 以查看仪表盘。</noscript>
    </section>
  </main>
  <div class="embed-canvas" id="board-canvas" hidden>
    <div class="board-toolbar">
      <label class="locale-picker"><span class="locale-label">界面语言</span><select class="tb-select" aria-label="界面语言" data-locale-picker><option value="zh-CN" lang="zh-CN" translate="no">简体中文</option><option value="en" lang="en" translate="no">English</option></select></label>
      <div id="tabs" class="tabs"></div>
      <div id="filters" class="filters"></div>
    </div>
    <section id="grid" class="board-grid"></section>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/grid.js"></script>
  <script src="/echarts.min.js"></script>
  <script src="/viz.js"></script>
  <script src="/embed/access.js"></script>
  <script src="/dashboard-view.js"></script>
</body>
</html>
