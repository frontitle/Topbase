<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/analytics.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 登录</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
  <main class="card">
    <label class="locale-picker"><span class="locale-label">界面语言</span><select class="tb-select" aria-label="界面语言" data-locale-picker><option value="zh-CN" lang="zh-CN" translate="no">简体中文</option><option value="en" lang="en" translate="no">English</option></select></label>
    <h1>登录工作区</h1>
    <p class="lead" id="lead" hidden></p>
    <form id="form">
      <label class="tb-field">邮箱<input class="tb-input" id="email" type="email" required autocomplete="username"></label>
      <label class="tb-field">密码<input class="tb-input" id="password" type="password" required autocomplete="current-password"></label>
      <button class="tb-btn tb-btn-primary" type="submit">登录</button>
    </form>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="providers" class="provider-list" hidden></div>
    <p class="hint"><a href="/setup/">创建工作区</a></p>
  </main>
  <script src="/ui.js"></script>
  <script src="/auth/login/login.js"></script>
</body>
</html>
