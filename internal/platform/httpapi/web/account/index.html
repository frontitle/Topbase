<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 个人中心</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/account/account.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="account"></aside>
  <div class="page">
    <header class="topbar"><strong>个人中心</strong><div class="top-actions"><a class="secondary" href="/">返回工作台</a></div></header>
    <main class="account-page">
      <section class="account-hero">
        <div class="account-avatar account-avatar-large" data-avatar><span>T</span><img alt="个人头像" hidden></div>
        <div class="account-identity">
          <span class="account-kicker">账户设置</span>
          <h1 id="account-name">正在读取账户…</h1>
          <p id="account-email">—</p>
          <div id="account-badges" class="account-badges"></div>
        </div>
        <button class="secondary danger-subtle" id="logout" type="button">退出登录</button>
      </section>

      <nav class="account-tabs" aria-label="个人中心设置">
        <button class="active" type="button" data-tab="profile">资料与头像</button>
        <button type="button" data-tab="security">登录与安全</button>
        <button type="button" data-tab="bindings">账号绑定</button>
      </nav>

      <section class="account-panel" data-panel="profile">
        <div class="account-panel-head"><div><h2>个人资料</h2><p>这些信息用于工作台、数据组和协作记录中的身份展示。</p></div></div>
        <form id="profile-form">
          <div class="avatar-editor">
            <div class="account-avatar" data-avatar><span>T</span><img alt="头像预览" hidden></div>
            <div><strong>头像</strong><p>支持 PNG、JPEG、WebP，上传后会自动裁剪压缩。</p><div class="inline-actions"><label class="secondary file-button">上传新头像<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button class="tertiary" id="remove-avatar" type="button">移除</button></div></div>
          </div>
          <div class="account-form-grid">
            <label><span>姓名 <em>*</em></span><input id="profile-name" required maxlength="80" autocomplete="name"></label>
            <label><span>登录邮箱 <em>*</em></span><input id="profile-email" type="email" required autocomplete="email"><small>修改邮箱时需要填写当前密码。</small></label>
            <label class="email-password" id="email-password" hidden><span>当前密码 <em>*</em></span><input id="profile-current-password" type="password" autocomplete="current-password"><small>仅用于确认本次邮箱修改。</small></label>
          </div>
          <footer class="account-form-footer"><span id="profile-status" role="status"></span><button class="primary" type="submit">保存个人资料</button></footer>
        </form>
      </section>

      <section class="account-panel" data-panel="security" hidden>
        <div class="account-panel-head"><div><h2>登录与安全</h2><p>定期更新密码，不要与其他产品重复使用同一密码。</p></div><span id="password-status" class="account-state">密码登录</span></div>
        <form id="password-form" class="security-form">
          <label><span>当前密码 <em>*</em></span><input id="current-password" type="password" required autocomplete="current-password"></label>
          <label><span>新密码 <em>*</em></span><input id="new-password" type="password" required minlength="8" autocomplete="new-password"><small>至少 8 位，建议同时包含字母、数字和符号。</small></label>
          <label><span>确认新密码 <em>*</em></span><input id="confirm-password" type="password" required minlength="8" autocomplete="new-password"></label>
          <footer class="account-form-footer"><span id="security-status" role="status"></span><button class="primary" type="submit">更新密码</button></footer>
        </form>
      </section>

      <section class="account-panel" data-panel="bindings" hidden>
        <div class="account-panel-head"><div><h2>账号绑定</h2><p>绑定常用办公平台后，可以使用同一身份安全登录 Topbase。</p></div></div>
        <div id="binding-list" class="binding-list"><div class="account-loading">正在读取可用登录方式…</div></div>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script src="/account/account.js"></script>
</body>
</html>
