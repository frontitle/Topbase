<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/workspace.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 数据工作台</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="home"></aside>
  <div class="page">
    <main class="home-overview">
      <div class="page-head home-head">
        <div>
          <h1 id="welcome">欢迎回来</h1>
        </div>
        <div class="home-head-actions">
          <a class="secondary" href="/data/">查看源数据</a>
          <div class="tb-menu-anchor">
            <button class="primary tb-button-with-caret" type="button" id="home-create">新建<span class="tb-caret" aria-hidden="true"></span></button>
            <div class="tb-menu tb-menu-end" id="home-create-menu" aria-label="新建内容" hidden>
              <a href="/questions/new/">创建分析</a>
              <button type="button" id="menu-create-dashboard">新建仪表盘</button>
            </div>
          </div>
        </div>
      </div>

      <section class="home-stats" aria-label="核心数据统计">
        <a class="home-stat" href="/data/">
          <span><i class="stat-mark">▣</i>数据源</span>
          <strong id="stat-databases">—</strong>
          <small id="stat-databases-meta">正在读取连接状态</small>
        </a>
        <a class="home-stat" href="/questions/">
          <span><i class="stat-mark">◇</i>分析</span>
          <strong id="stat-questions">—</strong>
          <small>已保存的查询</small>
        </a>
        <a class="home-stat" href="/dashboard/">
          <span><i class="stat-mark">☷</i>仪表盘</span>
          <strong id="stat-dashboards">—</strong>
          <small>已创建的仪表盘</small>
        </a>
        <a class="home-stat" href="/questions/?view=groups">
          <span><i class="stat-mark">☰</i>分析分组</span>
          <strong id="stat-collections">—</strong>
          <small>个人与团队分组</small>
        </a>
      </section>

      <section class="home-layout">
        <div class="home-main-column">
          <section class="home-section">
            <div class="home-section-head">
              <div><h2>快捷开始</h2></div>
            </div>
            <div class="home-quick-grid">
              <a class="home-quick" href="/questions/new/">
                <i>＋</i><span><strong>创建分析</strong><small>用字段和筛选构建查询</small></span><b>→</b>
              </a>
              <a class="home-quick" href="/data/">
                <i>▦</i><span><strong>查看源数据</strong><small>只读查询已连接的数据库</small></span><b>→</b>
              </a>
              <button class="home-quick" id="create-dashboard" type="button">
                <i>☷</i><span><strong>新建仪表盘</strong><small>把分析放在同一页</small></span><b>→</b>
              </button>
              <a class="home-quick" href="/questions/?view=groups">
                <i>☰</i><span><strong>管理分析分组</strong><small>组织个人与团队分析</small></span><b>→</b>
              </a>
              <a class="home-quick" id="admin-database-link" href="/admin/" hidden>
                <i>⚙</i><span><strong>连接数据源</strong><small>添加或维护数据库连接</small></span><b>→</b>
              </a>
              <a class="home-quick" id="warehouse-link" href="/warehouse/" hidden>
                <i>▦</i><span><strong>数据沉淀</strong><small>保存分析结果并按计划更新</small></span><b>→</b>
              </a>
            </div>
          </section>

          <section class="home-section">
            <div class="home-section-head">
              <div><h2>最近内容</h2></div>
              <a href="/questions/">查看全部</a>
            </div>
            <div id="recent-content" class="home-recent-list">
              <div class="home-loading">正在读取最近内容…</div>
            </div>
          </section>
        </div>

        <div class="home-side-column">
          <section class="home-section home-health">
            <div class="home-section-head">
              <div><h2>数据连接</h2></div>
              <span id="ready-badge" class="home-status">检查中</span>
            </div>
            <div id="database-health" class="home-health-list">
              <div class="home-loading">正在读取连接状态…</div>
            </div>
            <a class="home-section-link" href="/data/">打开源数据 <span>→</span></a>
          </section>

          <section class="home-section">
            <div class="home-section-head">
              <div><h2>最新动态</h2><p>任务与订阅通知</p></div>
            </div>
            <div id="notifications" class="home-notification-list">
              <div class="home-loading">正在读取动态…</div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script src="/app.js"></script>
</body>
</html>
