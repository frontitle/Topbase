<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 仪表盘</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/grid.css">
  <link rel="stylesheet" href="/viz.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="dashboards"></aside>
  <div class="page board-page">
    <header class="topbar">
      <a href="/dashboard/">仪表盘</a><span>/</span><strong id="title">加载中</strong>
      <div class="top-actions">
        <span id="view-actions">
          <button class="secondary" id="fullscreen" type="button">全屏</button>
          <button class="secondary" id="share" type="button">分享 / 嵌入</button>
          <button class="secondary" id="more" type="button">更多</button>
        </span>
        <button class="primary" id="edit" type="button">编辑</button>
      </div>
    </header>
    <main>
      <div class="board-layout viewing" id="layout">
        <aside class="board-palette" id="palette">
          <div class="palette-tabs" id="palette-tabs" role="tablist" aria-label="添加内容">
            <button class="active" data-palette-tab="analysis" type="button">添加分析</button>
            <button data-palette-tab="components" type="button">添加小组件</button>
          </div>
          <div class="palette-content">
          <div class="palette-section" data-palette-panel="analysis" role="tabpanel">
            <h3>快速添加分析</h3>
            <p class="hint">点击立即添加，也可以拖到右侧指定位置。</p>
            <input id="qsearch" type="search" placeholder="搜索已创建的分析">
            <select id="qcollection" aria-label="按分组筛选分析"><option value="">全部分组</option></select>
            <div id="palette-questions"></div>
            <button class="secondary palette-more" id="palette-more" type="button" hidden>加载更多</button>
          </div>
          <div class="palette-section palette-components" data-palette-panel="components" role="tabpanel" hidden>
            <h3>小组件</h3>
            <div class="palette-actions">
              <button class="secondary" draggable="true" data-add="heading" type="button">标题</button>
              <button class="secondary" draggable="true" data-add="text" type="button">文本</button>
            </div>
            <div class="palette-actions">
              <button class="secondary" draggable="true" data-add="link" type="button">链接</button>
              <button class="secondary" draggable="true" data-add="iframe" type="button">网页</button>
            </div>
            <div class="palette-actions">
              <button class="secondary" id="add-image" type="button">图片</button>
              <button class="secondary" draggable="true" data-add="divider" type="button">分隔线</button>
            </div>
            <div class="palette-actions">
              <button class="secondary" draggable="true" data-add="time" type="button">时间</button>
              <button class="secondary" draggable="true" data-add="plugin" type="button">自定义组件</button>
            </div>
            <a class="plugin-doc-link" href="/developers/dashboard-components/" target="_blank" rel="noopener">开发第三方组件 ↗</a>
            <input id="image-upload" type="file" accept="image/*" multiple hidden>
          </div>
          </div>
        </aside>
        <div id="canvas-controls" class="canvas-controls" hidden></div>
        <div class="board-canvas" id="board-canvas">
          <div class="board-toolbar">
            <div id="tabs" class="tabs"></div>
            <div id="filters" class="filters"></div>
          </div>
          <section id="grid" class="board-grid"></section>
        </div>
      </div>
    </main>
  </div>
  <div id="more-menu" class="board-menu" hidden></div>
  <div id="modal" class="board-modal" hidden></div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script src="/grid.js"></script>
  <script src="/echarts.min.js"></script>
  <script src="/viz.js"></script>
  <script src="/dashboard-view.js"></script>
</body>
</html>
