<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 分析</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/questions-list.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="questions"></aside>
  <div class="page">
    <header class="topbar"><strong>分析</strong></header>
    <main>
      <div class="page-head">
        <div>
          <h1>分析</h1>
          <p>创建可视化或 SQL 分析，并在这里用分组整理个人与团队内容。</p>
        </div>
        <a class="primary" href="/questions/new/">新建分析</a>
      </div>
      <nav class="analysis-tabs" role="tablist" aria-label="分析内容">
        <button class="active" type="button" role="tab" aria-selected="true" data-analysis-view="items">分析列表</button>
        <button type="button" role="tab" aria-selected="false" data-analysis-view="groups">分组管理 <span id="group-count"></span></button>
      </nav>
      <section id="analysis-view">
        <div class="toolbar">
          <label><span>⌕</span><input id="search" placeholder="搜索分析"></label>
          <select id="collection" aria-label="按分组筛选"><option value="">全部分组</option></select>
        </div>
        <section id="list" class="cards"></section>
      </section>
      <section id="groups-view" hidden>
        <div class="group-view-head">
          <div><h2>分析分组</h2><p>分组只负责整理分析和协作权限，不会复制或改变数据。</p></div>
          <button class="primary" id="create-group" type="button">新建分组</button>
        </div>
        <section id="group-list" class="analysis-group-list"></section>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script src="/questions-list.js"></script>
</body>
</html>
