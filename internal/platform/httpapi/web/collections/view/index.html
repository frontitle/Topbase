<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 分析分组</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="questions"></aside>
  <div class="page">
    <header class="topbar">
      <a href="/questions/">分析</a><span>/</span><a href="/questions/?view=groups">分组</a><span>/</span><strong id="title">加载中</strong>
      <div class="top-actions">
        <button class="secondary" id="rename" type="button">重命名</button>
        <button class="secondary" id="add-child" type="button">新建子分组</button>
        <button class="secondary" id="share" type="button">共享分组</button>
        <button class="secondary" id="remove" type="button">删除</button>
      </div>
    </header>
    <main>
      <div class="page-head">
        <div>
          <h1 id="heading">分析分组</h1>
          <p id="project-meta">分组内的分析与仪表盘可继续按子分组整理。</p>
        </div>
      </div>
      <section class="section-block">
        <h2>子分组</h2>
        <div id="children" class="cards"></div>
      </section>
      <section class="section-block">
        <h2>分析</h2>
        <div id="questions" class="cards"></div>
      </section>
      <section class="section-block">
        <h2>仪表盘</h2>
        <div id="dashboards" class="cards"></div>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script>
    const id=location.pathname.split('/').filter(Boolean)[1];
    let payload=null;
    async function load(){
      payload=await api('/api/collections/'+id);
      const c=payload.collection;
      $('#title').textContent=c.name;
      $('#heading').textContent=c.name;
      $('#project-meta').textContent=c.read_only?'这是 '+(c.shared_by_name||'其他成员')+' 共享给你的个人分组；你可以查看其中的内容，但不能修改。':(c.kind==='personal_project'?'这是你的个人分组；用于整理自己的分析和仪表盘，也可以共享给其他成员查看。':'这是企业项目；成员角色统一由管理后台配置。');
      $('#children').innerHTML=(payload.children||[]).map(x=>cardHTML({href:'/collections/'+x.id+'/',title:x.name,meta:'子分组'})).join('')||emptyHTML({icon:'☰',title:'没有子分组',body:'可以用右上角「新建子分组」继续分层整理。'});
      $('#questions').innerHTML=(payload.questions||[]).map(q=>cardHTML({href:'/questions/'+q.id+'/',title:q.name,meta:q.query_type==='native'?'SQL 分析':'可视化分析'})).join('')||emptyHTML({icon:'◇',title:'还没有分析',body:'新建分析后，可以移动到当前分组。',href:'/questions/new/',cta:'新建分析'});
      $('#dashboards').innerHTML=(payload.dashboards||[]).map(d=>cardHTML({href:'/dashboard/'+d.id+'/',title:d.name,meta:(d.cards||[]).length+' 张卡片'})).join('')||emptyHTML({icon:'☷',title:'还没有仪表盘',body:'可将仪表盘发布到当前分组，供团队共同查看。',href:'/dashboard/',cta:'新建仪表盘'});
      const readOnly=!!c.read_only;
      $('#remove').hidden=!!c.personal_owner_user_id||readOnly;
      $('#share').hidden=c.kind!=='personal_project'||readOnly;
      $('#rename').hidden=readOnly;
      $('#add-child').hidden=readOnly;
    }
    $('#rename').onclick=async()=>{
      const name=await promptDialog({kicker:'分析分组',title:'重命名分组',label:'分组名称',value:payload.collection.name,confirmText:'保存名称'});
      if(!name)return;
      await api('/api/collections/'+id,'PUT',{name,parent_id:payload.collection.parent_id||''});
      load();
    };
    $('#add-child').onclick=async()=>{
      const name=await promptDialog({kicker:'分析分组',title:'创建子分组',description:'子分组会创建在“'+payload.collection.name+'”下面。',label:'子分组名称',placeholder:'例如：月度报表',confirmText:'创建子分组'});
      if(!name)return;
      const item=await api('/api/collections','POST',{name,parent_id:id});
      location.href='/collections/'+item.id+'/';
    };
    $('#share').onclick=async()=>{
      try{
        const [members,shared]=await Promise.all([api('/api/shareable-users'),api('/api/collections/'+id+'/shares')]);
        const values=await formDialog({kicker:'共享个人分组',title:'选择可查看的成员',description:'被共享的成员会在自己的分析首页看到此分组；他们只能查看，不能修改或移动其中内容。',size:'wide',confirmText:'保存共享',fields:[{name:'user_ids',label:'共享给成员',type:'multichoice',value:shared.map(member=>member.id),options:members.map(member=>({value:member.id,label:member.name,description:member.email}))}]});
        if(!values)return;
        await api('/api/collections/'+id+'/shares','PUT',{user_ids:values.user_ids||[]});toast('分组共享已保存');
      }catch(e){toast(e.message)}
    };
    $('#remove').onclick=async()=>{
      if(!await confirmDialog({kicker:'删除分组',title:'删除“'+payload.collection.name+'”？',description:'只有空分组可以删除；其中的分析、仪表盘或子分组需要先移动。',confirmText:'删除分组',tone:'danger'}))return;
      try{await api('/api/collections/'+id,'DELETE');location.href='/questions/#analysis-groups'}catch(e){toast(e.message)}
    };
    load().catch(e=>toast(e.message));
  </script>
</body>
</html>
