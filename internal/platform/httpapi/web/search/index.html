<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 搜索</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="search"></aside>
  <div class="page">
    <header class="topbar"><strong>搜索</strong></header>
    <main>
      <div class="page-head">
        <div>
          <h1>搜索</h1>
          <p>查找分析、仪表盘、数据组和数据源。</p>
        </div>
      </div>
      <section class="toolbar">
        <label><span>⌕</span><input id="q" placeholder="搜索分析、仪表盘、数据组、数据源"></label>
      </section>
      <section id="results" class="cards"></section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script>
    const href={question:id=>'/questions/'+id+'/',dashboard:id=>'/dashboard/'+id+'/',collection:id=>'/collections/'+id+'/',database:id=>'/data/?db='+encodeURIComponent(id)};
    const typeLabel={question:'分析',dashboard:'仪表盘',collection:'数据组',database:'数据源'};
    async function run(){
      const q=$('#q').value.trim();
      if(!q){$('#results').innerHTML='';return}
      try{
        const items=await api('/api/search?q='+encodeURIComponent(q));
        $('#results').innerHTML=items.map(i=>cardHTML({href:(href[i.type]||(()=>'/'))(i.id),title:i.name,meta:typeLabel[i.type]||i.type})).join('')||emptyHTML({icon:'⌕',title:'没有匹配结果',body:'换个关键词试试，或到分析、数据组列表里浏览。'});
      }catch(e){toast(e.message)}
    }
    $('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(run,200)};
  </script>
</body>
</html>
