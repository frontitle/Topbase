<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/locale.js"></script>
  <script src="/locales/common.js"></script>
  <script src="/locales/analytics.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 初始化</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
  <main class="card">
    <label class="locale-picker"><span class="locale-label">界面语言</span><select class="tb-select" aria-label="界面语言" data-locale-picker><option value="zh-CN" lang="zh-CN" translate="no">简体中文</option><option value="en" lang="en" translate="no">English</option></select></label>
    <h1>创建工作区</h1>
    <form id="form">
      <section class="setup-storage" id="storage-mode" aria-live="polite">
        <div><span class="setup-storage-label">应用数据库</span><strong id="storage-title">检查中…</strong></div>
        <p id="storage-description"></p>
        <label class="storage-risk" id="storage-risk" hidden><input id="accept_storage_risk" type="checkbox"><span>我已了解：Docker 未挂载 <code>/data</code> 时，重建或升级容器可能清空账户、连接、分析和仪表盘。</span></label>
      </section>
      <label class="tb-field">工作区名称<input class="tb-input" id="site_name" value="Topbase" autocomplete="organization"></label>
      <label class="tb-field">管理员姓名<input class="tb-input" id="admin_name" required placeholder="例如：王晨" autocomplete="name"></label>
      <label class="tb-field">管理员邮箱<input class="tb-input" id="admin_email" type="email" required placeholder="you@company.com" autocomplete="username"></label>
      <label class="tb-field">密码（至少 8 位）<input class="tb-input" id="admin_password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="tb-btn tb-btn-primary" type="submit">创建工作区</button>
      <p id="error" class="error" hidden></p>
    </form>
  </main>
  <script src="/ui.js"></script>
  <script src="/setup/setup.js"></script>
</body>
</html>
