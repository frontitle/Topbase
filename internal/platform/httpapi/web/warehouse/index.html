<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Topbase · 数仓</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <aside class="sidebar" data-shell="app" data-active="warehouse"></aside>
  <div class="page">
    <header class="topbar"><strong>数仓</strong></header>
    <main>
      <div class="page-head">
        <div>
          <h1>查询结果升级数仓</h1>
          <p>把已保存分析写成 <code>warehouse.wh_*</code> 表。物化需确认调度后才会执行；增量调度按 watermark 追加行。</p>
        </div>
      </div>
      <section class="section-block">
        <h2>物化表</h2>
        <div class="cards" id="tables"></div>
      </section>
      <section class="section-block">
        <h2>调度</h2>
        <div class="cards" id="schedules"></div>
      </section>
      <section class="section-block">
        <h2>创建调度</h2>
        <form id="form" class="create-box">
          <label>分析<select id="questions" required></select></label>
          <label>说明<input id="message" value="每天 9 点写入数仓"></label>
          <pre id="proposal" class="muted-box">先提案，再确认创建。</pre>
          <div class="actions">
            <button class="secondary" type="button" id="propose">AI 提案</button>
            <button class="primary" type="submit">确认并创建</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="/ui.js"></script>
  <script src="/shell.js"></script>
  <script src="/warehouse/warehouse.js"></script>
</body>
</html>
