services:
  appdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${TOPBASE_APP_DB_NAME:-topbase}"
      POSTGRES_USER: "${TOPBASE_APP_DB_USER:-topbase}"
      POSTGRES_PASSWORD: "${TOPBASE_APP_DB_PASSWORD:?set TOPBASE_APP_DB_PASSWORD in .env}"
    volumes:
      - topbase_appdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOPBASE_APP_DB_USER:-topbase} -d ${TOPBASE_APP_DB_NAME:-topbase}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  topbase:
    build:
      context: .
      args:
        VERSION: "${TOPBASE_VERSION:-0.2.3}"
        COMMIT: "${TOPBASE_COMMIT:-unknown}"
        BUILD_TIME: "${TOPBASE_BUILD_TIME:-unknown}"
    image: topbase/topbase:local
    ports:
      - "${TOPBASE_HTTP_PORT:-8101}:8080"
    environment:
      TOPBASE_ADDR: ":8080"
      TOPBASE_DATA_DIR: /data
      TOPBASE_APP_DB_ENGINE: postgres
      TOPBASE_APP_DB_HOST: appdb
      TOPBASE_APP_DB_PORT: "5432"
      TOPBASE_APP_DB_NAME: "${TOPBASE_APP_DB_NAME:-topbase}"
      TOPBASE_APP_DB_SCHEMA: public
      TOPBASE_APP_DB_USER: "${TOPBASE_APP_DB_USER:-topbase}"
      TOPBASE_APP_DB_PASSWORD: "${TOPBASE_APP_DB_PASSWORD:?set TOPBASE_APP_DB_PASSWORD in .env}"
      TOPBASE_APP_DB_TLS_MODE: disable
      TOPBASE_MASTER_KEY: "${TOPBASE_MASTER_KEY:?set TOPBASE_MASTER_KEY in .env}"
      TOPBASE_INSTANCE_ID: "${TOPBASE_INSTANCE_ID:-topbase-compose-1}"
      TOPBASE_CRON: "on"
      TOPBASE_SECURE_COOKIES: "${TOPBASE_SECURE_COOKIES:-false}"
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_WEBHOOK_URL: "${FEISHU_WEBHOOK_URL:-}"
    volumes:
      - topbase_data:/data
      - topbase_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      appdb:
        condition: service_healthy

volumes:
  topbase_appdb:
  topbase_data:
  topbase_backups:
