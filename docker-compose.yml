services:
  topbase:
    build:
      context: .
      args:
        VERSION: "${TOPBASE_VERSION:-0.2.4}"
        COMMIT: "${TOPBASE_COMMIT:-unknown}"
        BUILD_TIME: "${TOPBASE_BUILD_TIME:-unknown}"
    image: topbase/topbase:local
    ports:
      - "${TOPBASE_HTTP_PORT:-8101}:8080"
    environment:
      TOPBASE_ADDR: ":8080"
      TOPBASE_DATA_DIR: /data
      TOPBASE_CRON: "on"
      TOPBASE_SECURE_COOKIES: "${TOPBASE_SECURE_COOKIES:-false}"
      GOMEMLIMIT: "${TOPBASE_GOMEMLIMIT:-384MiB}"
      TOPBASE_MAX_CONCURRENT_QUERIES: "${TOPBASE_MAX_CONCURRENT_QUERIES:-8}"
      TOPBASE_QUERY_RESULT_MAX_BYTES: "${TOPBASE_QUERY_RESULT_MAX_BYTES:-16777216}"
      TOPBASE_QUERY_CELL_MAX_BYTES: "${TOPBASE_QUERY_CELL_MAX_BYTES:-1048576}"
      TOPBASE_SOURCE_DB_MAX_OPEN_CONNS: "${TOPBASE_SOURCE_DB_MAX_OPEN_CONNS:-8}"
      TOPBASE_SOURCE_DB_MAX_IDLE_CONNS: "${TOPBASE_SOURCE_DB_MAX_IDLE_CONNS:-4}"
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_WEBHOOK_URL: "${FEISHU_WEBHOOK_URL:-}"
    volumes:
      - topbase_data:/data
      - topbase_backups:/backups
    read_only: true
    mem_limit: "${TOPBASE_CONTAINER_MEMORY_LIMIT:-512m}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  topbase_data:
  topbase_backups:
